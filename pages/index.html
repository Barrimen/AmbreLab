<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portail JDR</title>
  <style>
    :root {
      --bg: #14161a;
      --card: #1e2127;
      --text: #e8e6e1;
      --muted: #9a978f;
      --accent: #c9a24b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 3rem 2rem;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    p.sub { color: var(--muted); margin-top: 0; margin-bottom: 2.5rem; }

    /* Regroupement par campagne */
    section.campaign { margin-bottom: 2.5rem; }
    h2.campaign-title {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 0.9rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #2c2f36;
      letter-spacing: 0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid #2c2f36;
      border-radius: 10px;
      padding: 1.25rem;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    a.card:hover { border-color: var(--accent); }
    a.card .name { font-weight: 600; margin-bottom: 0.25rem; }
    a.card .desc { color: var(--muted); font-size: 0.9rem; }

    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Portail JDR</h1>
    <p class="sub">Point d'entrée vers les campagnes et outils.</p>

    <!--
      Convention : une <section class="campaign"> par campagne.
      Ajouter une <a class="card"> par outil au fur et à mesure
      qu'il est déployé sous pages/<campagne>/...
    -->
    <section class="campaign">
      <h2 class="campaign-title">Elénior — Les Compagnons de l'Infortune (2026)</h2>
      <div class="grid">
        <a class="card" href="elenior/cadran/">
          <div class="name">Cadran des Trente Temps</div>
          <div class="desc">Gestionnaire de combat</div>
        </a>
        <a class="card" href="elenior/personnage/">
          <div class="name">Fiche de personnage</div>
          <div class="desc">Consultation et suivi de personnage</div>
        </a>
        <a class="card" href="elenior/magie/magie-index.html">
          <div class="name">Magie</div>
          <div class="desc">Calculateur et bibliothèque de sorts</div>
        </a>
      </div>
    </section>

    <!-- Prochaine campagne : dupliquer une <section class="campaign"> ci-dessus -->

    <footer>AmbreLab</footer>
  </div>
</body>
</html>
