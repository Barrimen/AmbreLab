<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche de personnage — Elénior</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);}
body{
  font-family:'Spectral',serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(192,132,66,0.08), transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, rgba(95,148,132,0.08), transparent 60%),
    var(--ink);
  min-height:100vh;
  padding:20px 20px 76px;
}
h1,h2,h3{font-family:'Cinzel',serif; letter-spacing:0.03em; margin:0;}
.wrap{max-width:1180px;margin:0 auto;}
.masque{display:none !important;}

/* ---------- Header ---------- */
header.top{
  display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px;
  flex-wrap:wrap; gap:10px;
}
header.top h1{font-size:24px; color:var(--parchment); font-weight:700;}
header.top h1 span{color:var(--copper);}
.subtitle{font-size:12.5px; color:var(--parchment-dim); font-style:italic; margin-top:4px;}

/* ---------- Panels ---------- */
.panel{
  background:linear-gradient(180deg, var(--ink-2), var(--ink-3));
  border:1px solid var(--line);
  border-radius:6px;
  padding:14px 16px 16px;
  margin-bottom:16px;
}
.panel h2{font-size:14px; color:var(--copper); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.06em;}

/* ---------- Buttons ---------- */
button{
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
  background:transparent; color:var(--parchment); border:1px solid var(--copper-dim);
  padding:8px 13px; border-radius:2px; cursor:pointer; transition:all .15s ease;
}
button:hover{background:rgba(192,132,66,0.12); border-color:var(--copper);}
button.primary{background:var(--copper); color:var(--ink); border-color:var(--copper); font-weight:700;}
button.primary:hover{background:#D69856;}
button.ghost{border-color:var(--line); color:var(--parchment-dim); padding:5px 10px; font-size:10px;}
button.danger{border-color:var(--blood); color:var(--blood); padding:4px 9px; font-size:10px;}
button.danger:hover{background:rgba(168,64,75,0.15);}
button:disabled{opacity:0.35; cursor:not-allowed;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}

/* ---------- Forms ---------- */
label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--parchment-dim); margin-bottom:4px;}
input,select,textarea{
  width:100%; background:var(--ink); border:1px solid var(--line); color:var(--parchment);
  padding:6px 8px; border-radius:2px; font-family:'Spectral'; font-size:13px;
}
textarea{resize:vertical;}
.field{margin-bottom:10px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
@media (max-width:760px){ .field-row,.field-row3{grid-template-columns:1fr;} }
.hint{font-size:10.5px; color:var(--parchment-dim); font-style:italic; margin-top:6px; line-height:1.4;}

/* ---------- Tables ---------- */
table{width:100%; border-collapse:collapse;}
.jet-table th{font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--parchment-dim); text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap;}
.jet-table td{padding:3px 5px; border-bottom:1px solid var(--line); vertical-align:middle;}
.jet-table input[type=number]{width:60px;}
.jet-table input[type=checkbox]{width:auto;}

/* ---------- Tabs ---------- */
.tabs-bar{display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px;}
.tab-btn{border:none; border-bottom:3px solid transparent; background:transparent; color:var(--parchment-dim); padding:9px 14px; font-size:11.5px;}
.tab-btn.actif{color:var(--copper); border-bottom-color:var(--copper);}
.tab-page{display:none;}
.tab-page.actif{display:block;}

/* ---------- Quotas ---------- */
.quota-ligne{display:flex; align-items:center; gap:10px; font-size:12px; margin-bottom:6px;}
.quota-ligne > span:first-child{min-width:180px;}
.quota-barre{flex:1; max-width:180px; height:6px; border-radius:3px; background:rgba(233,223,196,0.12); overflow:hidden;}
.quota-barre > div{height:100%; background:var(--verdigris);}
.quota-barre.depasse > div{background:var(--blood);}
.quota-alerte{color:var(--blood); font-weight:700; font-size:11px;}

/* ---------- État du personnage ---------- */
.etat-ligne{display:flex; justify-content:space-between; padding:3px 8px; border-radius:3px; font-size:12.5px;}
.etat-ligne.actif{background:var(--copper); color:var(--ink); font-weight:700;}

/* ---------- Portrait ---------- */
.portrait-cadre{border:1px solid var(--line); border-radius:5px; background:rgba(0,0,0,0.15); min-height:200px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:10px;}
.portrait-cadre img{width:100%; height:auto; max-height:520px; object-fit:contain;}

/* ---------- Sélecteur de personnage ---------- */
.perso-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:10px; margin-bottom:10px;}
.perso-carte{text-align:left; padding:12px; border:1px solid var(--line); border-radius:4px; background:rgba(0,0,0,0.15);}
.perso-carte:hover{border-color:var(--copper);}
.perso-nom{font-family:'Cinzel',serif; font-size:13px; color:var(--parchment); margin-bottom:4px;}
.perso-meta{font-size:11px; color:var(--parchment-dim);}

/* ---------- Barre d'outils ---------- */
.barre-outils{position:fixed; bottom:0; left:0; right:0; background:rgba(18,21,27,0.97); display:flex; gap:10px; justify-content:center; align-items:center; padding:9px; z-index:30; border-top:1px solid var(--line); flex-wrap:wrap;}
.etat-sv{color:var(--parchment-dim); font-size:11px; font-style:italic;}
#statut-chargement{color:var(--gold); font-size:12px; font-style:italic; margin-bottom:10px;}
#erreur-globale{color:var(--blood); font-size:12px; margin-bottom:10px;}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Fiche de <span>Personnage</span> — Elénior</h1>
      <div class="subtitle">Branchée sur api.ambrelab.com</div>
    </div>
  </header>

  <div id="statut-chargement" class="masque"></div>
  <div id="erreur-globale" class="masque"></div>

  <div id="ecran-selecteur">
    <div class="panel">
      <h2>Personnages de la campagne</h2>
      <div id="selecteur-liste" class="perso-grid"></div>
      <div class="btnrow"><button id="btn-nouveau-perso" class="primary">+ Nouveau personnage</button></div>
    </div>
  </div>

  <div id="ecran-fiche" class="masque">
    <div class="tabs-bar" id="entete-onglets"></div>
    <div id="conteneur-onglets"></div>
  </div>
</div>

<div class="barre-outils">
  <button id="btn-changer-perso" class="ghost masque">Changer de personnage</button>
  <button id="btn-verrou" class="ghost masque">Verrouiller la fiche</button>
  <button id="btn-effacer-jets" class="ghost masque">Effacer les jets</button>
  <span class="etat-sv" id="sv"></span>
</div>

<script src="../../shared/dice.js"></script>
<script src="../../shared/lock.js"></script>
<script src="../rules.js"></script>
<script>
/* ============================================================================
   FICHE DE PERSONNAGE ELÉNIOR — branchée sur l'API commune AmbreLab.
   1. Config + état   2. Outils DOM   3. Appels API   4. Sauvegarde
   5. Sélecteur de personnage   6. Chargement + provisionnement des catalogues
   7. Onglets (shell)   8. Fabriques génériques (tableaux de jets, listes)
   9. Pages   10. Calculs (quotas, PV/PP, encombrement, TA)   11. Démarrage
   ============================================================================ */

const API_BASE = 'https://api.ambrelab.com';
const CAMPAIGN_ID = 1; // Elénior — même convention que le Cadran

const etat = {
  character: null,
  combatSheet: null,
  mineures: [], ecoles: [], maitrises: [], armes: [], armure: [],
  sorts: [], inventaire: [], compagnons: [], contacts: [], competences: [],
  categorieArmure: 'Légère', // transitoire : pas de champ dédié côté API
};

// Références vers les fonctions de recalcul internes à l'onglet Combat,
// exposées ici pour être rappelées depuis l'onglet Caractéristiques quand
// une majeure change (Encombrement et TA en dépendent tous les deux).
let rafraichirCalculateurTA = () => {};
let rafraichirCalculateurTASelectArme = () => {};

/* ---------- 2. OUTILS DOM ---------- */

function el(tag, attrs = {}, ...enfants) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (attrs[k] === undefined || attrs[k] === null) continue;
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  enfants.forEach((c) => {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });
  return e;
}

// Marque un contrôle comme concerné par le verrouillage (pages/shared/lock.js).
function verrouillable(elm, opts = {}) {
  elm.setAttribute('data-lockable', 'true');
  if (opts.editableLocked) elm.setAttribute('data-editable-locked', 'true');
  return elm;
}

function afficherErreur(message) {
  const zone = document.getElementById('erreur-globale');
  zone.textContent = message;
  zone.classList.remove('masque');
}
function effacerErreur() {
  const zone = document.getElementById('erreur-globale');
  zone.textContent = '';
  zone.classList.add('masque');
}
function afficherChargement(message) {
  const zone = document.getElementById('statut-chargement');
  zone.textContent = message;
  zone.classList.remove('masque');
}
function masquerChargement() {
  document.getElementById('statut-chargement').classList.add('masque');
}

/* ---------- 3. APPELS API ---------- */

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || detail; } catch (e) { /* pas de corps JSON */ }
    throw new Error(`${res.status} ${detail}`);
  }
  if (res.status === 204) return null;
  return res.json();
}
const apiGet = (path) => api(path);
const apiPost = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });
const apiPut = (path, body) => api(path, { method: 'PUT', body: JSON.stringify(body) });
const apiDelete = (path) => api(path, { method: 'DELETE' });

function sansIdEtCampagne(obj) {
  const copie = { ...obj };
  delete copie.id; delete copie.campaign_id;
  return copie;
}
function sansIdCombatSheet(cs) {
  const copie = { ...cs };
  delete copie.id; delete copie.campaign_id;
  return copie;
}

/* ---------- 4. SAUVEGARDE (personnage) ---------- */

let minuteurSauvegarde = null;
function sauvegarderPersonnage() {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(async () => {
    try {
      const updated = await apiPut(`/characters/${etat.character.id}`, sansIdEtCampagne(etat.character));
      Object.assign(etat.character, updated);
      document.getElementById('sv').textContent = `Enregistré à ${new Date().toLocaleTimeString('fr-FR')}`;
    } catch (e) {
      document.getElementById('sv').textContent = `Erreur d'enregistrement : ${e.message}`;
    }
  }, 500);
}

/* ---------- Champs liés génériques (character) ---------- */

function champTexte(obj, cle, placeholder, opts = {}) {
  const i = el('input', { type: 'text', placeholder: placeholder || '', value: obj[cle] ?? '' });
  verrouillable(i, opts);
  i.addEventListener('input', () => { obj[cle] = i.value; sauvegarderPersonnage(); if (opts.onExtra) opts.onExtra(); });
  return i;
}
function champNombre(obj, cle, opts = {}) {
  const i = el('input', { type: 'number', value: obj[cle] ?? 0 });
  if (opts.min !== undefined) i.setAttribute('min', opts.min);
  if (opts.max !== undefined) i.setAttribute('max', opts.max);
  verrouillable(i, opts);
  i.addEventListener('input', () => { obj[cle] = Number(i.value) || 0; sauvegarderPersonnage(); if (opts.onExtra) opts.onExtra(); });
  return i;
}
function champTextarea(obj, cle, placeholder, hauteur, opts = {}) {
  const t = el('textarea', { style: hauteur ? `min-height:${hauteur}px` : '', placeholder: placeholder || '' });
  t.value = obj[cle] || '';
  verrouillable(t, opts);
  t.addEventListener('input', () => { obj[cle] = t.value; sauvegarderPersonnage(); if (opts.onExtra) opts.onExtra(); });
  return t;
}

/* ---------- 5. SÉLECTEUR DE PERSONNAGE ---------- */

async function chargerSelecteurPersonnages() {
  effacerErreur();
  const conteneur = document.getElementById('selecteur-liste');
  conteneur.innerHTML = '';
  try {
    const persos = await apiGet(`/campaigns/${CAMPAIGN_ID}/characters`);
    if (persos.length === 0) {
      conteneur.appendChild(el('p', { class: 'hint' }, 'Aucun personnage dans cette campagne pour le moment.'));
    }
    persos.forEach((p) => {
      const carte = el('button', { class: 'perso-carte', onclick: () => choisirPersonnage(p.id) },
        el('div', { class: 'perso-nom' }, p.name || '(sans nom)'),
        el('div', { class: 'perso-meta' }, [p.classe, p.race].filter(Boolean).join(' · ') || '—'));
      conteneur.appendChild(carte);
    });
  } catch (e) {
    afficherErreur(`Impossible de charger les personnages : ${e.message}`);
  }
}

async function creerNouveauPersonnage() {
  const nom = prompt('Nom du personnage ?');
  if (!nom) return;
  try {
    const created = await apiPost(`/campaigns/${CAMPAIGN_ID}/characters`, { name: nom });
    await choisirPersonnage(created.id);
  } catch (e) {
    afficherErreur(`Impossible de créer le personnage : ${e.message}`);
  }
}

function retourSelecteur() {
  document.getElementById('ecran-fiche').classList.add('masque');
  document.getElementById('ecran-selecteur').classList.remove('masque');
  document.getElementById('btn-changer-perso').classList.add('masque');
  document.getElementById('btn-verrou').classList.add('masque');
  document.getElementById('btn-effacer-jets').classList.add('masque');
  chargerSelecteurPersonnages();
}

async function choisirPersonnage(id) {
  effacerErreur();
  afficherChargement('Chargement du personnage…');
  try {
    etat.character = await apiGet(`/characters/${id}`);
    const sheets = await apiGet(`/campaigns/${CAMPAIGN_ID}/combatsheets`);
    etat.combatSheet = sheets.find((s) => s.character_id === id) || null;
    await chargerToutesLesListes();
    await provisionnerCataloguesSiVides();
    document.getElementById('ecran-selecteur').classList.add('masque');
    document.getElementById('ecran-fiche').classList.remove('masque');
    document.getElementById('btn-changer-perso').classList.remove('masque');
    document.getElementById('btn-verrou').classList.remove('masque');
    document.getElementById('btn-effacer-jets').classList.remove('masque');
    construireTout();
    recalculerTout();
  } catch (e) {
    afficherErreur(`Impossible de charger ce personnage : ${e.message}`);
  } finally {
    masquerChargement();
  }
}

/* ---------- 6. CHARGEMENT DES LISTES + PROVISIONNEMENT DES CATALOGUES ---------- */

async function chargerToutesLesListes() {
  const cid = etat.character.id;
  const [mineures, ecoles, sorts, inventaire, compagnons, contacts, competences] = await Promise.all([
    apiGet(`/characters/${cid}/minor-skills`),
    apiGet(`/characters/${cid}/magic-schools`),
    apiGet(`/characters/${cid}/spells`),
    apiGet(`/characters/${cid}/inventory`),
    apiGet(`/characters/${cid}/companions`),
    apiGet(`/characters/${cid}/contacts`),
    apiGet(`/characters/${cid}/special-skills`),
  ]);
  etat.mineures = mineures; etat.ecoles = ecoles; etat.sorts = sorts; etat.inventaire = inventaire;
  etat.compagnons = compagnons; etat.contacts = contacts; etat.competences = competences;

  if (etat.combatSheet) {
    const sid = etat.combatSheet.id;
    const [maitrises, armes, armure] = await Promise.all([
      apiGet(`/combatsheets/${sid}/weapon-masteries`),
      apiGet(`/combatsheets/${sid}/weapons`),
      apiGet(`/combatsheets/${sid}/armor-pieces`),
    ]);
    etat.maitrises = maitrises; etat.armes = armes; etat.armure = armure;
  } else {
    etat.maitrises = []; etat.armes = []; etat.armure = [];
  }
}

// Un nouveau personnage n'a, au départ, aucune ligne de mineures/maîtrises/
// écoles : le catalogue est fixe (cf. pages/elenior/rules.js) et provisionné
// une seule fois ici, via les routes CRUD génériques déjà en place (pas de
// nouvelle route serveur pour ça).
async function provisionnerCataloguesSiVides() {
  const R = window.AmbreRules;
  const cid = etat.character.id;

  if (etat.mineures.length === 0) {
    afficherChargement('Mise en place du catalogue des mineures…');
    for (const nom of R.MINEURES_CATALOGUE) {
      const created = await apiPost(`/characters/${cid}/minor-skills`, { name: nom, value: 0, majeure_liee: '' });
      etat.mineures.push(created);
    }
  }
  if (etat.ecoles.length === 0) {
    afficherChargement('Mise en place du catalogue des écoles de magie…');
    for (const nom of R.ECOLES_CATALOGUE) {
      const created = await apiPost(`/characters/${cid}/magic-schools`, { name: nom, value: 0 });
      etat.ecoles.push(created);
    }
  }
  if (etat.combatSheet && etat.maitrises.length === 0) {
    afficherChargement('Mise en place du catalogue des maîtrises d\'armes…');
    const sid = etat.combatSheet.id;
    for (const cat of R.CATEGORIES_ARMES) {
      const created = await apiPost(`/combatsheets/${sid}/weapon-masteries`, { category: cat, value: 0 });
      etat.maitrises.push(created);
    }
  }
}

/* ---------- 7. ONGLETS (SHELL) ---------- */

const ONGLETS = [
  { id: 'identite', titre: 'Identité' },
  { id: 'caracteristiques', titre: 'Caractéristiques' },
  { id: 'combat', titre: 'Combat' },
  { id: 'magie', titre: 'Magie' },
  { id: 'sorts', titre: 'Sorts' },
  { id: 'notes', titre: 'Compagnons & Notes' },
  { id: 'options', titre: 'Options', desactive: true },
];

function construireTout() {
  const barre = document.getElementById('entete-onglets'); barre.innerHTML = '';
  const conteneur = document.getElementById('conteneur-onglets'); conteneur.innerHTML = '';
  ONGLETS.forEach((o, i) => {
    const attrs = { class: 'tab-btn' + (i === 0 ? ' actif' : '') };
    if (!o.desactive) attrs.onclick = () => changerOnglet(o.id);
    const b = el('button', attrs, o.titre);
    b.id = 'onglet-btn-' + o.id;
    if (o.desactive) b.disabled = true;
    barre.appendChild(b);
    conteneur.appendChild(el('div', { class: 'tab-page' + (i === 0 ? ' actif' : ''), id: 'page-' + o.id }));
  });
  construirePageIdentite(document.getElementById('page-identite'));
  construirePageCaracteristiques(document.getElementById('page-caracteristiques'));
  construirePageCombat(document.getElementById('page-combat'));
  construirePageMagie(document.getElementById('page-magie'));
  construirePageSorts(document.getElementById('page-sorts'));
  construirePageNotes(document.getElementById('page-notes'));
  document.getElementById('page-options').appendChild(el('p', { class: 'hint' }, 'Réservé pour une prochaine évolution.'));
}
function changerOnglet(id) {
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('actif'));
  document.querySelectorAll('.tab-page').forEach((p) => p.classList.remove('actif'));
  document.getElementById('onglet-btn-' + id).classList.add('actif');
  document.getElementById('page-' + id).classList.add('actif');
}

/* ---------- 8. FABRIQUES GÉNÉRIQUES ---------- */

// Tableau de jets (mineures / maîtrises d'armes / écoles de magie) : même
// mécanique de seuil partout (Seuil = floor(Majeure/2) + valeur).
function construireTableauJets({ conteneur, titre, liste, colonneLabel, obtenirNom, majFn, apresChangement }) {
  const R = window.AmbreRules;
  const cadre = el('div', { class: 'panel' });
  if (titre) cadre.appendChild(el('h2', {}, titre));
  const table = el('table', { class: 'jet-table' });
  table.appendChild(el('tr', {}, el('th', {}, colonneLabel), el('th', {}, 'Valeur'), el('th', {}, 'Palier'), el('th', {}, 'Majeure'), el('th', {}, 'Seuil'), el('th', {}, 'Jet')));
  liste.forEach((item) => {
    const tr = el('tr');
    tr.appendChild(el('td', {}, obtenirNom(item)));
    const tdPalier = el('td', {}, R.palierMineure(item.value));
    const tdSeuil = el('td', {}); const tdJet = el('td', {});

    const inputVal = el('input', { type: 'number', min: 0, max: 100, value: item.value ?? 0 });
    verrouillable(inputVal);
    inputVal.addEventListener('input', async () => {
      const v = Number(inputVal.value) || 0;
      await majFn(item, { value: v });
      tdPalier.textContent = R.palierMineure(item.value);
      remplirSeuilEtJet(item, tdSeuil, tdJet);
      if (apresChangement) apresChangement();
    });

    const selectMaj = el('select');
    selectMaj.appendChild(el('option', { value: '' }, '—'));
    R.MAJEURES_NOMS.forEach((n) => {
      const o = el('option', { value: n }, R.MAJEURES_LABELS[n]);
      if (item.majeure_liee === n) o.setAttribute('selected', 'true');
      selectMaj.appendChild(o);
    });
    verrouillable(selectMaj);
    selectMaj.addEventListener('change', async () => {
      await majFn(item, { majeure_liee: selectMaj.value });
      remplirSeuilEtJet(item, tdSeuil, tdJet);
      if (apresChangement) apresChangement();
    });

    tr.appendChild(el('td', {}, inputVal));
    tr.appendChild(tdPalier);
    tr.appendChild(el('td', {}, selectMaj));
    remplirSeuilEtJet(item, tdSeuil, tdJet);
    tr.appendChild(tdSeuil); tr.appendChild(tdJet);
    table.appendChild(tr);
  });
  cadre.appendChild(table);
  if (conteneur) conteneur.appendChild(cadre);
  return cadre;
}

        dessiner();
      });
      tr.appendChild(el('td', {}, btnSup));
      table.appendChild(tr);
    });
  }
  dessiner();
  cadre.appendChild(table);
  btnAjout.addEventListener('click', async () => {
    const created = await creerItem();
    liste.push(created);
    dessiner();

function construireBlocPortrait() {
  const cadre = el('div', { class: 'panel' });
  cadre.appendChild(el('h2', {}, 'Portrait'));
  const cadreImg = el('div', { class: 'portrait-cadre' });
  const inputFichier = el('input', { type: 'file', accept: 'image/*' });
  verrouillable(inputFichier);
  const statut = el('div', { class: 'hint', style: 'margin-top:6px;' });

  async function rafraichirPortrait() {
    cadreImg.innerHTML = '';
    if (!etat.character.portrait_url) {
      cadreImg.appendChild(el('span', { class: 'hint' }, 'Aucun portrait'));
      return;
    }
    try {
      const { url } = await apiGet(`/characters/${etat.character.id}/portrait-url`);
      if (!url) { cadreImg.appendChild(el('span', { class: 'hint' }, 'Aucun portrait')); return; }
      cadreImg.appendChild(el('img', { src: url, alt: 'Portrait' }));
    } catch (e) {
      cadreImg.appendChild(el('span', { class: 'hint' }, `Portrait indisponible : ${e.message}`));
    }
  }

  inputFichier.addEventListener('change', async () => {
    const fichier = inputFichier.files[0];
    if (!fichier) return;
    statut.textContent = 'Envoi en cours…';
    try {
      const ext = (fichier.name.split('.').pop() || 'jpg').toLowerCase();
      const contentType = fichier.type || 'image/jpeg';
      const { upload_url, key } = await apiPost(`/characters/${etat.character.id}/portrait-upload-url`, { extension: ext, content_type: contentType });
      const resUpload = await fetch(upload_url, { method: 'PUT', body: fichier, headers: { 'Content-Type': contentType } });
      if (!resUpload.ok) throw new Error(`Échec de l'envoi vers R2 (${resUpload.status})`);
      etat.character.portrait_url = key;
      const updated = await apiPut(`/characters/${etat.character.id}`, sansIdEtCampagne(etat.character));
      Object.assign(etat.character, updated);
      statut.textContent = 'Portrait mis à jour.';
      rafraichirPortrait();
    } catch (e) {
      statut.textContent = `Échec de l'envoi : ${e.message}`;
    }
  });

  cadre.appendChild(cadreImg);
  cadre.appendChild(inputFichier);
  cadre.appendChild(statut);
  rafraichirPortrait();
  return cadre;
}

  const champCat = el('div', { class: 'field' }); champCat.appendChild(el('label', {}, 'Catégorie d\'armure')); champCat.appendChild(selectCat);
  const champStat = el('div', { class: 'field' }); champStat.appendChild(el('label', {}, 'Caractéristique de réduction')); champStat.appendChild(selectStat);
  const champRes = el('div', { class: 'field' }); champRes.appendChild(el('label', {}, 'Malus net calculé')); champRes.appendChild(resultat);
  grille.appendChild(champCat); grille.appendChild(champStat); grille.appendChild(champRes);
  cadre.appendChild(grille);
  cadre.appendChild(el('p', { class: 'hint' }, 'Total = somme de la colonne Enc. du tableau d\'armure ci-dessus, réduit selon la table p.68. Légère/Médium se réduisent par l\'Agilité, Intermédiaire/Lourde par la Force. Écrit dans la fiche de combat (lu par le Cadran).'));

  async function recalculer() {
    const totalBrut = etat.armure.reduce((s, p) => s + (Number(p.encombrement) || 0), 0);
    const table = selectStat.value === 'Force' ? R.REDUCTION_FORCE : R.REDUCTION_AGILITE;
    const statVal = Number(etat.character['carac_' + selectStat.value.toLowerCase()]) || 0;
    const net = R.appliquerReductionEncombrement(totalBrut, statVal, table);
    etat.categorieArmure = selectCat.value;
    const netArrondi = Math.round(net);
    resultat.textContent = `${totalBrut} brut → ${netArrondi} net`;
    if (etat.combatSheet) {
      etat.combatSheet.encombrement = netArrondi;
      try {
        etat.combatSheet = await apiPut(`/combatsheets/${etat.combatSheet.id}`, sansIdCombatSheet(etat.combatSheet));
      } catch (e) { /* pas bloquant pour l'affichage si la sauvegarde échoue ponctuellement */ }
    }
    rafraichirCalculateurTA();
  }
  selectCat.addEventListener('change', () => {
    selectStat.value = (selectCat.value === 'Légère' || selectCat.value === 'Médium') ? 'Agilite' : 'Force';
    recalculer();
  });
  selectStat.addEventListener('change', recalculer);
  recalculer();
  construireBlocEncombrement.recalculerActuel = recalculer;
  page.appendChild(cadre);
}

function construireCalculateurTA(page) {
  const R = window.AmbreRules;
  const cadre = el('div', { class: 'panel' });
  cadre.appendChild(el('h2', {}, 'Calculateur de Temps d\'Action'));
  const grille = el('div', { class: 'field-row3' });
  const selectCategorie = el('select');
  R.CATEGORIES_ARMES.forEach((c) => selectCategorie.appendChild(el('option', { value: c }, c)));
  const selectCar1 = el('select'); const selectCar2 = el('select');
  [selectCar1, selectCar2].forEach((s) => {
    s.appendChild(el('option', { value: '' }, '—'));
    R.MAJEURES_NOMS.forEach((n) => s.appendChild(el('option', { value: n }, R.MAJEURES_LABELS[n])));
  });
  verrouillable(selectCategorie); verrouillable(selectCar1); verrouillable(selectCar2);
  const champ1 = el('div', { class: 'field' }); champ1.appendChild(el('label', {}, 'Type d\'arme/technique')); champ1.appendChild(selectCategorie);
  const champ2 = el('div', { class: 'field' }); champ2.appendChild(el('label', {}, 'Caractéristique 1')); champ2.appendChild(selectCar1);
  const champ3 = el('div', { class: 'field' }); champ3.appendChild(el('label', {}, 'Caractéristique 2')); champ3.appendChild(selectCar2);
  grille.appendChild(champ1); grille.appendChild(champ2); grille.appendChild(champ3);
  cadre.appendChild(grille);

  const champArme = el('div', { class: 'field' });
  champArme.appendChild(el('label', {}, 'Arme utilisée (pour son malus d\'encombrement)'));
  const selectArme = el('select');
  verrouillable(selectArme);
  function reconstruireOptionsArme() {
    const valeurActuelle = selectArme.value;
    selectArme.innerHTML = '';
    selectArme.appendChild(el('option', { value: '' }, '— aucune —'));
    etat.armes.forEach((a) => selectArme.appendChild(el('option', { value: String(a.id) }, a.name || '(sans nom)')));
    selectArme.value = valeurActuelle;
  }
  reconstruireOptionsArme();
  champArme.appendChild(selectArme);
  cadre.appendChild(champArme);

  const resultat = el('div', { style: 'margin-top:10px;font-size:14px;' });
  function recalculer() {
    const v1 = Number(etat.character['carac_' + (selectCar1.value || '').toLowerCase()]) || 0;
    const v2 = Number(etat.character['carac_' + (selectCar2.value || '').toLowerCase()]) || 0;
    const malusArmure = etat.combatSheet ? (Number(etat.combatSheet.encombrement) || 0) : 0;
    const armeChoisie = etat.armes.find((a) => String(a.id) === selectArme.value);
    const malusArme = armeChoisie ? (Number(armeChoisie.encombrement) || 0) : 0;
    const scoreNet = Math.floor((v1 + v2) / 2) - malusArmure - malusArme;
    const tranche = R.trouverTranche(scoreNet);
    const paire = tranche.d[selectCategorie.value];
    resultat.innerHTML = `Malus armure (auto) : <b>${malusArmure}</b> · Malus arme : <b>${malusArme}</b><br>` +
      `Score net : <b>${scoreNet}</b> · Tranche : <b>${tranche.nom}</b>` +
      (paire ? ` · <b>${paire[0]} dés / ${paire[1]} Temps d'Action</b>` : ' · catégorie non trouvée dans cette tranche');
  }
  [selectCategorie, selectCar1, selectCar2, selectArme].forEach((s) => s.addEventListener('change', recalculer));
  recalculer();
  cadre.appendChild(resultat);
  cadre.appendChild(el('p', { class: 'hint' }, 'Score net = (Car1 + Car2) ÷ 2 arrondi à l\'entier inférieur, moins le malus d\'armure (calculé ci-dessus) et le malus de l\'arme choisie.'));
  page.appendChild(cadre);
  rafraichirCalculateurTA = recalculer;
  rafraichirCalculateurTASelectArme = reconstruireOptionsArme;
}

/* ----- Sorts & Techniques ----- */
function construirePageSorts(page) {
  page.innerHTML = '';
  const cadre = el('div', { class: 'panel' });
  const entete = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;' });
  entete.appendChild(el('h2', { style: 'margin:0;' }, 'Sorts & Techniques'));
  const btnAjout = el('button', { class: 'ghost' }, '+ sort');
  verrouillable(btnAjout);
  entete.appendChild(btnAjout);
  cadre.appendChild(entete);
  const grille = el('div', { style: 'display:flex;flex-wrap:wrap;gap:12px;' });

  function dessiner() {
    grille.innerHTML = '';
    etat.sorts.forEach((item) => {
      const carte = el('div', { class: 'panel', style: 'flex:1;min-width:260px;margin-bottom:0;' });
      const inpNom = el('input', { type: 'text', value: item.name || '', placeholder: 'Nom du sort', style: 'font-weight:bold;margin-bottom:8px;' });
      verrouillable(inpNom);
      inpNom.addEventListener('input', async () => { await majSort(item, { name: inpNom.value }); });
      carte.appendChild(inpNom);

      const meta = el('div', { class: 'field-row' });
      [['ecole', 'École'], ['cout', 'Coût PP'], ['portee', 'Portée'], ['duree', 'Durée']].forEach(([cle, label]) => {
        const champ = el('div', { class: 'field' });
        champ.appendChild(el('label', {}, label));
        const inp = el('input', { type: 'text', value: item[cle] || '' });
        verrouillable(inp);
        inp.addEventListener('input', async () => { const c = {}; c[cle] = inp.value; await majSort(item, c); });
        champ.appendChild(inp);
        meta.appendChild(champ);
      });
      carte.appendChild(meta);

      const desc = el('textarea', { style: 'min-height:70px;', placeholder: 'Effets, conditions…' });
      desc.value = item.description || '';
      verrouillable(desc);
      desc.addEventListener('input', async () => { await majSort(item, { description: desc.value }); });
      carte.appendChild(desc);

      const btnSup = el('button', { class: 'danger', style: 'margin-top:8px;' }, 'Supprimer ce sort');
      verrouillable(btnSup);
      btnSup.addEventListener('click', async () => {
        await apiDelete(`/spells/${item.id}`);
        etat.sorts = etat.sorts.filter((s) => s.id !== item.id);
        dessiner();
      });
      carte.appendChild(btnSup);
      grille.appendChild(carte);
    });
  }
  dessiner();
  cadre.appendChild(grille);
  btnAjout.addEventListener('click', async () => {
    const created = await apiPost(`/characters/${etat.character.id}/spells`, { name: '', ecole: '', cout: '', portee: '', duree: '', description: '' });
    etat.sorts.push(created);
    dessiner();
  });
  page.appendChild(cadre);
}
async function majSort(item, champs) {
  Object.assign(item, champs);
  const payload = { name: item.name || '', ecole: item.ecole || '', cout: item.cout || '', portee: item.portee || '', duree: item.duree || '', description: item.description || '' };
  const updated = await apiPut(`/spells/${item.id}`, payload);
  Object.assign(item, updated);
}

/* ---------- 10. CALCULS TRANSVERSES ---------- */

function rafraichirQuotas() {
  const conteneur = document.getElementById('bloc-quotas');
  if (!conteneur) return;
  const R = window.AmbreRules;
  conteneur.innerHTML = '';
  conteneur.appendChild(el('h2', {}, 'Quotas de répartition (mineures + armes + écoles)'));
  const compte = R.compterUtilisationQuotas([etat.mineures, etat.maitrises, etat.ecoles]);
  R.QUOTAS_PALIERS.forEach((q) => {
    const utilise = compte[q.valeur] || 0;
    const depasse = utilise > q.nb;
    const ligne = el('div', { class: 'quota-ligne' });
    ligne.appendChild(el('span', {}, `Valeur ${q.valeur} : ${utilise} / ${q.nb} créneaux`));
    const barre = el('div', { class: 'quota-barre' + (depasse ? ' depasse' : '') });
    barre.appendChild(el('div', { style: `width:${Math.min(100, (utilise / q.nb) * 100)}%` }));
    ligne.appendChild(barre);
    if (depasse) ligne.appendChild(el('span', { class: 'quota-alerte' }, '⚠ dépassé'));
    conteneur.appendChild(ligne);
  });
}

function rafraichirEtatSection() {
  const R = window.AmbreRules;
  const conteneur = document.getElementById('etat-personnage-liste');
  if (conteneur) {
    const max = Number(etat.character.pv_max) || 0;
    const ratio = max > 0 ? Math.round(((Number(etat.character.pv_actuel) || 0) / max) * 100) : 100;
    const seuilActif = R.etatSelonRatio(ratio);
    conteneur.querySelectorAll('.etat-ligne').forEach((l) => { l.classList.toggle('actif', Number(l.dataset.seuil) === seuilActif); });
  }
  const pvP = document.getElementById('pv-max-affiche');
  if (pvP) pvP.textContent = `PV max calculé : ${etat.character.pv_max || 0}`;
  const ppP = document.getElementById('pp-max-affiche');
  if (ppP) ppP.textContent = `PP max calculé : ${etat.character.pp_max || 0}`;
}

function recalculerTout() {
  const R = window.AmbreRules;
  let sommePV = 0; let sommePP = 0;
  etat.mineures.forEach((m) => {
    if (R.palierMineure(m.value) === 'Fort') {
      const t = R.TABLE_PV_PP_MINEURE[m.name];
      if (t) { sommePV += t[0]; sommePP += t[1]; }
    }
  });
  etat.ecoles.forEach((m) => {
    if (R.palierMineure(m.value) === 'Fort') {
      const t = R.TABLE_PV_PP_ECOLE[m.name];
      if (t) { sommePV += t[0]; sommePP += t[1]; }
    }
  });
  etat.maitrises.forEach((m) => {
    if (R.palierMineure(m.value) === 'Fort') {
      const t = R.TABLE_PV_PP_ARME[m.category];
      if (t) { sommePV += t[0]; sommePP += t[1]; }
    }
  });
  etat.character.pv_max = sommePV + (Number(etat.character.pv_libres) || 0);
  etat.character.pp_max = sommePP + (Number(etat.character.pp_libres) || 0);
  sauvegarderPersonnage();
  rafraichirQuotas();
  rafraichirEtatSection();
}
